# Headless Debian rootfs profile for Cartzy on NXP i.MX8MP.

---
mmdebstrap:
  architectures:
    - arm64
  mode: auto
  # NOTE: this key must be plural. bdebstrap's MMDEBSTRAP_OPTS only recognises
  # 'aptopts'; a singular 'aptopt' is silently ignored (which had masked every
  # setting here). Values are written VERBATIM into the target's
  # /etc/apt/apt.conf.d/99mmdebstrap by mmdebstrap, so they must use apt.conf
  # syntax `Key "value"`, NOT command-line `-o Key=value` syntax (the '=' form
  # produces "Syntax error ... Extra junk at end of file").
  aptopts:
    - 'Acquire::Retries "10"'
    - 'Acquire::ForceIPv4 "true"'
    - 'Acquire::http::Timeout "60"'
    - 'Acquire::https::Timeout "60"'
    # One request per connection - avoids multiplexing that trips flaky links.
    - 'Acquire::http::Pipeline-Depth "0"'
    # Route build-time apt through apt-cacher-ng (compose service `apt-cache`,
    # published on the host loopback which the chroot shares via network_mode:
    # host). Removed from the shipped image by a customize-hook below.
    - 'Acquire::http::Proxy "http://127.0.0.1:3142"'
    - 'Acquire::https::Proxy "http://127.0.0.1:3142"'
  keyrings:
    - /usr/share/keyrings/debian-archive-keyring.gpg
  mirrors:
    - http://deb.debian.org/debian
  suite: bookworm
  target: rootfs
  hostname: imx8mpcartzy
  variant: standard
  components:
    - main
    - contrib
    - non-free-firmware
  packages:
    - init
    - udev
    - sudo
    - apt
    - zstd
    - iputils-ping
    - isc-dhcp-client
    - curl
    - ca-certificates
    - git
    - rsync
    - systemd
    - systemd-sysv
    - psmisc
    - strace
    - gdb
    - ethtool
    - net-tools
    - iproute2
    - openssh-server
    - util-linux
    - parted
    - cmake
    - keyutils
    - wpasupplicant
    - initramfs-tools
    - mmc-utils
    - i2c-tools
    - locales
    - network-manager
    - rfkill
    - iw
    - wireless-regdb
    - tzdata
    - systemd-resolved
    - avahi-daemon
    - u-boot-tools
    - unzip
    - docker.io
  setup-hooks:
    - 'if [ -f /run/systemd/resolve/resolv.conf ]; then cp -L /run/systemd/resolve/resolv.conf $1/etc/resolv.conf; elif [ -f /etc/resolv.conf ]; then cp -L /etc/resolv.conf $1/etc/resolv.conf; else printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\n" > $1/etc/resolv.conf; fi'
    - 'mkdir -p $1/usr/local/bin $1/etc/udev/rules.d $1/etc/modprobe.d'
    - 'mkdir -p $1/etc/systemd/system/multi-user.target.wants'
    - 'mkdir -p $1/etc/systemd/system/local-fs.target.wants'
  essential-hooks:
    - 'sleep 10'
  customize-hooks:
    - 'chroot "$1" useradd -m -d /home/debian -s /bin/bash debian'
    - 'chroot "$1" usermod -aG sudo,input,video debian'
    - 'chroot "$1" passwd --delete root'
    - 'chroot "$1" passwd --delete debian'
    - 'chroot "$1" cp /etc/skel/.bashrc ~/.bashrc'
    - 'chroot "$1" echo "PermitRootLogin yes" >> $1/etc/ssh/sshd_config'
    - 'chroot "$1" echo "PermitEmptyPasswords yes" >> $1/etc/ssh/sshd_config'
    - 'chroot "$1" echo "127.0.0.1 localhost" >> $1/etc/hosts'
    - 'cp src/system/boot.mount $1/lib/systemd/system/'
    - 'cp tools/flex-installer $1/usr/bin/'
    - 'cp tools/resizerfs $1/usr/bin/'
    - 'cp src/system/udev/udev-rules-*/*.rules $1/etc/udev/rules.d/'
    - 'cp src/system/distroplatcfg $1/usr/bin/'
    - 'cp src/system/platcfg.service $1/lib/systemd/system/'
    - 'cp src/system/blacklist.conf $1/etc/modprobe.d/'
    - 'cp src/system/ts.conf $1/etc/'
    - 'cp src/system/board_id.sh $1/usr/bin/'
    - 'chroot "$1" ln -s /lib/systemd/system/platcfg.service /etc/systemd/system/multi-user.target.wants/platcfg.service'
    - 'chroot "$1" ln -s /lib/systemd/system/boot.mount /etc/systemd/system/local-fs.target.wants/boot.mount'
    - 'chroot "$1" ln -s /boot/tools/perf /usr/local/bin/perf'
    - 'chroot "$1" ln -s /sbin/init /init'
    - 'chroot "$1" ln -s /boot/modules /lib/modules'
    - 'chroot "$1" ln -s /usr/lib/systemd/system/multi-user.target /etc/systemd/system/default.target'
    - 'chroot "$1" sed -i -e "s/.*zh_CN.UTF-8.*/zh_CN.UTF-8 UTF-8/" -e "s/.*en_US.UTF-8.*/en_US.UTF-8 UTF-8/" /etc/locale.gen'
    - 'chroot "$1" /usr/sbin/locale-gen'
    - 'chroot "$1" /usr/sbin/update-locale LANG=en_US.UTF-8'
    - 'printf "/usr/lib\n" >> $1/etc/ld.so.conf.d/01-sdk.conf'
    - 'printf " * Support:   https://www.nxp.com/support\n" >> $1/etc/update-motd.d/20-help-text'
    - 'printf " * Licensing: https://lsdk.github.io/eula\n" >> $1/etc/update-motd.d/20-help-text'
    - 'printf "NXP Linux SDK 2506 Debian Cartzy headless\n" >> $1/etc/issue'
    - 'printf "debian_cartzy_arm64.yaml\n" > $1/etc/flexbuild-rootfs-profile'
    - 'printf "Build: `date --rfc-3339 seconds`\n" >> $1/etc/buildinfo'
    - 'printf "d /var/lib/apt/lists 0755 root root -\n" > $1/usr/lib/tmpfiles.d/apt-lists.conf'
    - 'printf "d /var/lib/apt/lists/partial 0700 _apt root -\n" >> $1/usr/lib/tmpfiles.d/apt-lists.conf'
    - 'chroot "$1" install -d -m 0755 -o root -g root /var/lib/apt/lists'
    - 'chroot "$1" sh -c "if id -u _apt >/dev/null 2>&1; then install -d -m 0700 -o _apt -g root /var/lib/apt/lists/partial; else install -d -m 0700 -o root -g root /var/lib/apt/lists/partial; fi"'
    - 'printf "Acquire::Languages \\"none\\";\n" > $1/etc/apt/apt.conf.d/99-nolang'
    - 'printf "Acquire::Retries 10;\nAcquire::ForceIPv4 true;\nAcquire::http::Timeout 60;\nAcquire::http::Proxy false;\nAcquire::https::Proxy false;\n" > $1/etc/apt/apt.conf.d/99flexbuild-net.conf'
    - 'rm -rf $1/usr/share/doc/* $1/usr/share/help/* $1/usr/share/man/*'
    - 'chroot "$1" apt-get clean || true'
    - 'cp $CARTZY_SYSTEM_PATH/imx8/os/etc/systemd/system/cartzy-firstboot.service $1/etc/systemd/system/'
    - 'cp $CARTZY_SYSTEM_PATH/imx8/os/usr/local/sbin/cartzy-firstboot.sh $1/usr/local/sbin/'
    - 'chroot "$1" chmod +x /usr/local/sbin/cartzy-firstboot.sh'
    - 'mkdir -p $1/etc/systemd/system/multi-user.target.wants'
    - 'chroot "$1" ln -sf /etc/systemd/system/cartzy-firstboot.service /etc/systemd/system/multi-user.target.wants/cartzy-firstboot.service'
    # Grow the root partition and the root filesystem after the image was
    # flashed onto a bigger card. The partition table is written by
    # cartzy-grow-rootfs.sh (the kernel needs a reboot to pick up the new
    # size), the filesystem is grown online by systemd-growfs.
    - 'cp $CARTZY_SYSTEM_PATH/imx8/os/etc/systemd/system/cartzy-grow-rootfs.service $1/etc/systemd/system/'
    - 'cp $CARTZY_SYSTEM_PATH/imx8/os/etc/systemd/system/cartzy-growfs.service $1/etc/systemd/system/'
    - 'chmod 644 $1/etc/systemd/system/cartzy-grow-rootfs.service'
    - 'chmod 644 $1/etc/systemd/system/cartzy-growfs.service'
    - 'cp $CARTZY_SYSTEM_PATH/imx8/os/usr/local/sbin/cartzy-grow-rootfs.sh $1/usr/local/sbin/'
    - 'chroot "$1" chmod +x /usr/local/sbin/cartzy-grow-rootfs.sh'
    - 'chroot "$1" ln -sf /etc/systemd/system/cartzy-grow-rootfs.service /etc/systemd/system/multi-user.target.wants/cartzy-grow-rootfs.service'
    - 'chroot "$1" ln -sf /etc/systemd/system/cartzy-growfs.service /etc/systemd/system/multi-user.target.wants/cartzy-growfs.service'
    - 'rm -f $1/etc/systemd/system/multi-user.target.wants/networking.service'
    - 'ln -sf /dev/null $1/etc/systemd/system/networking.service'
    - 'rm -f $1/etc/systemd/system/multi-user.target.wants/ifupdown-pre.service'
    - 'ln -sf /dev/null $1/etc/systemd/system/ifupdown-pre.service'
    - 'chroot "$1" ln -sf /lib/systemd/system/ssh.service /etc/systemd/system/multi-user.target.wants/ssh.service'
    - 'chroot "$1" ln -sf /lib/systemd/system/NetworkManager.service /etc/systemd/system/multi-user.target.wants/NetworkManager.service'
    # Docker on board: the daemon + client come from the 'docker.io' package above;
    # the services are enabled and the default user joins the docker group, so no
    # post-flash install-docker.sh and no reboot are needed.
    - 'chroot "$1" systemctl enable docker.service containerd.service'
    - 'chroot "$1" usermod -aG docker debian'
    # The 'cartzy' user is created by cartzy-firstboot.sh at first boot, so it
    # can only join the docker group afterwards.
    - 'cp src/system/cartzy-docker-group.service $1/etc/systemd/system/'
    - 'chmod 644 $1/etc/systemd/system/cartzy-docker-group.service'
    - 'cp src/system/cartzy-docker-group.sh $1/usr/local/sbin/'
    - 'chmod +x $1/usr/local/sbin/cartzy-docker-group.sh'
    - 'chroot "$1" ln -sf /etc/systemd/system/cartzy-docker-group.service /etc/systemd/system/multi-user.target.wants/cartzy-docker-group.service'
    # compose v2 as a CLI plugin, cached on the host under firmware-cache/ so rebuilds
    # don't re-download it. Must be a single physical line: YAML folds multi-line
    # single-quoted scalars into spaces, and the trailing `\` on each continuation
    # becomes a literal-escaped-space argument. dash then fails to see `if` as the
    # shell keyword and errors with `Syntax error: "then" unexpected`.
    - 'mkdir -p firmware-cache && compose_cache=firmware-cache/docker-compose-linux-aarch64 && if [ ! -f "$compose_cache" ]; then curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "$compose_cache" https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-aarch64 && echo "6e9fbd5daa20dca5d7d89145081ae8155d68ef2928b497d9f85b54fe0f9dbb2c  $compose_cache" | sha256sum -c - && chmod +x "$compose_cache"; fi && mkdir -p "$1/usr/local/lib/docker/cli-plugins" && cp "$compose_cache" "$1/usr/local/lib/docker/cli-plugins/docker-compose"'
    # Neutralise the build-time proxy before shipping. mmdebstrap writes our aptopts
    # into 99mmdebstrap, which sorts AFTER 99flexbuild-net.conf and would otherwise
    # override Proxy=false with the cache URL, causing the board's apt to try to
    # reach 127.0.0.1:3142 (our build host) at runtime. Retries/Timeout/ForceIPv4
    # stay; only the proxy URL is swapped for DIRECT.
    - 'if [ -f "$1/etc/apt/apt.conf.d/99mmdebstrap" ]; then sed -i "s|http://127.0.0.1:3142|DIRECT|g" "$1/etc/apt/apt.conf.d/99mmdebstrap"; fi'
