# [general]

machine=imx8mpcartzy

UBOOT_CONFIG="imx8mp_evk_defconfig"

COMPOSITE_IMG1_FILE_sd="bsp/imx-mkimage/imx8mpcartzy/flash.bin"

# distro boot script
# dummy value, real boot script is provided by Cartzy boot overlay
distro_bootscript="bsp/u-boot/imx8mpevk/imx8mpevk_boot.scr"

# Cartzy boot overlay (boot.txt/uEnv.txt)
if [ -z "$CARTZY_SYSTEM_PATH" ]; then
    echo "CARTZY_SYSTEM_PATH is not set. Export it before build." >&2
    exit 1
fi
BOOT_OVERLAY_DIR="$CARTZY_SYSTEM_PATH/imx8/os/boot"

# Copy cartzy_system files to rootfs
CARTZY_COPY_TO_ROOTFS=1

# Install a reusable kernel header bundle into the target image.
# This is used for native builds on the board and for mounting into IMX build containers.
ROOTFS_KERNEL_HEADERS_DIR="/usr/linux-headers"
ROOTFS_KERNEL_HEADERS_SYMLINK=1

# Cartzy CameraModule uses libgpiod 2.x API, while Debian 12 bookworm ships 1.6.x in main.
# Enable bookworm-backports in the image and preinstall the required GPIO packages.
ROOTFS_APT_BACKPORTS="bookworm-backports"
ROOTFS_APT_BACKPORTS_COMPONENTS="main"
ROOTFS_APT_BACKPORTS_PACKAGES="libgpiod-dev libgpiod3 gpiod"

# Sound Open Firmware Zephyr payload is not used on this board and its
# external tarball should not be able to break the whole image build.
SKIP_SOF_ZEPHYR=1

# Use the dedicated Cartzy rootfs profile directly instead of pulling the full
# desktop runtime package set.
DISTROTYPE=debian
DISTROVARIANT=cartzy
DEBIAN_ROOTFS_CONFIG="debian_cartzy_arm64.yaml"
# Cartzy does not use the NXP demo/desktop stacks. Keep only the app groups
# that match cartzy_system/cartzy_capture/cartzy_edge requirements.
PKG_GROUPS_GRAPHICS=n
PKG_GROUPS_SECURITY=n
PKG_GROUPS_UTILS=n
PKG_GROUPS_GOPOINT=n
# `bld -m` still compiles NXP app stacks against the generated rootfs, so keep
# the flexbuild sysroot devel package install enabled for this machine.
ROOTFS_INSTALL_DEVEL_PACKAGES=1
FRAGMENT_CFG_OVERRIDE="imx8mpcartzy_override.config"
